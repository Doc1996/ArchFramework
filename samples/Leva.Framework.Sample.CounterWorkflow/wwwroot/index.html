<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>CounterWorkflow sample</title>
	<link rel="stylesheet" href="/sample.css?v=6" />
</head>
<body>
	<h1>CounterWorkflow</h1>
	<p>
		Builds an Engine <code>Context</code>, registers states, queues events, runs the event loop, and creates
		a report through <code>ExecutionRunner</code>.
	</p>

	<section>
		<h2>Run</h2>
		<button id="run">Run workflow checks</button>
		<p id="summary" class="muted">No run yet.</p>
	</section>

	<section>
		<h2>Result</h2>
		<div class="grid">
			<div class="card"><strong>State</strong><br /><span id="state">-</span></div>
			<div class="card"><strong>Count</strong><br /><span id="count">-</span></div>
			<div class="card"><strong>Runtime entries</strong><br /><span id="runtime-count">-</span></div>
			<div class="card"><strong>Execution entries</strong><br /><span id="execution-count">-</span></div>
		</div>
		<p><strong>Report:</strong> <span id="report">-</span></p>
	</section>

	<section>
		<h2>Checks</h2>
		<ul id="checks"></ul>
	</section>

	<section>
		<h2>Runtime log</h2>
		<ul id="runtime"></ul>
	</section>

	<section>
		<h2>Executions</h2>
		<ul id="executions"></ul>
	</section>

	<script src="/sample.js?v=6"></script>
</body>
</html>
